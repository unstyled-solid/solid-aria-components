name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: Build and test library
    # Playwright 1.57 supports 24.04; ubuntu-latest has moved to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library declarations and runtime
        run: |
          pnpm stage:i18n
          pnpm stage:types
          pnpm stage:build

      - name: Run library unit and SSR smoke tests
        run: pnpm test:pilot

      - name: Install browser engines and system libraries
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run existing library browser suites and collect diagnostics
        run: |
          set +e
          node scripts/test-diagnostics/run.mjs
          status=$?
          node scripts/test-diagnostics/report.mjs
          report_status=$?
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          exit "$report_status"

      - name: Retain failed browser-test evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-diagnostics
          path: tracking/browser-test-diagnostics/raw/
          if-no-files-found: ignore
          retention-days: 3
